<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boka bord – Kafé Kardemumma</title>
</head>
<body>
  <header>
    <h1>Kafé Kardemumma</h1>
    <nav aria-label="Huvudmeny">
      <ul>
        <li><a href="index.html">Startsida</a></li>
        <li><a href="index.html#meny">Meny</a></li>
        <li><a href="kontakt.html" aria-current="page">Boka bord</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Boka bord</h2>
    <p>Fyll i formuläret så bekräftar vi din bokning inom ett dygn. Fält markerade med * är obligatoriska.</p>

    <form action="#" method="post">
      <div class="falt">
        <label for="namn">Namn</label>
        <input type="text" id="namn" name="namn" placeholder="Sune Sunesson">
      </div>

      <div class="falt">
        <label for="epost">E-postadress</label>
        <input type="email" id="epost" name="epost" placeholder="namn@exempel.se">
      </div>

      <div class="falt">
        <label for="telefon">Telefonnummer</label>
        <input type="tele" id="telefon" name="telefon" placeholder="000-0000000">
      </div>

      <div class="falt">
        <label for="datum">Datum</label>
        <input type="date" id="datum" name="datum" placeholder="00/00/0000">
      </div>
      
      <div class="falt"></div>
        <label for="antal">Antal Personer</label>
        <select id="antal" name="antal">
            <option value="">Välj antal</option>
            <option value="1">1 person</option>
            <option value="2">2 personer</option>
            <option value="3">3 personer</option>
            <option value="4">4 personer</option>
            <option value="5">5 personer</option>
        </select>

        <label for="onskemal">Önskemål</label>
        <textarea id="onskemal" name="onskemal" rows="4"></textarea>
      </div>
      <!-- TODO 3: fieldset + legend för kostönskemål och bekräftelsesätt -->
      <!-- TODO 4: samtyckeskryssruta (required) och skickaknapp -->
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Kafé Kardemumma</p>
    <address>
      Fiktivgatan 1, 111 11 Stockholm<br>
      <a href="mailto:hej@kardemumma.example">hej@kardemumma.example</a>
    </address>
  </footer>
</body>
</html>
